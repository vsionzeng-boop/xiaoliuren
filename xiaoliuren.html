<title>小六壬 · 掌中课</title>

<style>
:root{
  --bg:#0d0e11; --card:#181b21; --line:#2a2f38; --ink:#e9e3d4;
  --dim:#8b8f99; --gold:#d0a94a; --gold2:#6b5520; --dimtxt:#cfc9ba;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;
  -webkit-text-size-adjust:100%}
body{min-height:100vh;background-image:radial-gradient(circle at 50% 0%,#1b1f27 0%,#0d0e11 55%);background-attachment:fixed}
.wrap{max-width:520px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom))}

header{text-align:center;padding:6px 0 18px}
h1{margin:0;font-size:22px;font-weight:400;letter-spacing:.5em;text-indent:.5em;color:#e8dfc8}
h1 .dot{color:var(--gold)}
.sub{margin-top:8px;font-size:12px;color:var(--dim);letter-spacing:.26em;text-indent:.26em}

.topics{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.topics::-webkit-scrollbar{display:none}
.topics button{flex:0 0 auto;padding:8px 16px;border-radius:999px;border:1px solid var(--line);
  background:#14171c;color:var(--dim);font:inherit;font-size:13.5px;letter-spacing:.1em}
.topics button.on{color:var(--gold);border-color:var(--gold2);background:rgba(208,169,74,.1)}

.seg{display:flex;background:#14171c;border:1px solid var(--line);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;background:none;border:0;color:var(--dim);font:inherit;font-size:14px;padding:11px 0;border-radius:10px;letter-spacing:.1em}
.seg button.on{background:linear-gradient(180deg,#2a2f38,#1e2229);color:var(--gold);box-shadow:inset 0 0 0 1px #3a4150}

.panel{display:none;margin-top:14px}
.panel.on{display:block}

.info{background:#14171c;border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #1e2229;font-size:14px}
.info-row:last-child{border-bottom:0}
.info-row span{color:var(--dim);font-size:12.5px;letter-spacing:.12em}
.info-row b{font-weight:400;color:#ded6c2;letter-spacing:.04em}

.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.nums input{width:100%;background:#14171c;border:1px solid var(--line);border-radius:13px;color:var(--ink);
  font:inherit;font-size:21px;text-align:center;padding:15px 0;outline:none}
.nums input:focus{border-color:var(--gold2);background:#191c22}
.nums input::placeholder{color:#4a4f58;font-size:15px}
.hint{margin-top:10px;font-size:12px;color:#6d727c;line-height:1.8}
.link{color:var(--gold);border:0;background:none;font:inherit;font-size:12.5px;padding:0;text-decoration:underline;text-underline-offset:3px}

.cast{width:100%;margin-top:16px;padding:17px;border-radius:15px;border:1px solid #6b5520;
  background:linear-gradient(180deg,#3a2f14,#241d0c);color:var(--gold);
  font:inherit;font-size:16px;letter-spacing:.45em;text-indent:.45em;
  box-shadow:0 6px 22px rgba(0,0,0,.45)}
.cast:active{transform:scale(.985);filter:brightness(1.15)}

.triple{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mini{background:#15181d;border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center}
.mini.good{border-color:#2e4a36;background:linear-gradient(180deg,#161d18,#141719)}
.mini.bad{border-color:#4a2c2c;background:linear-gradient(180deg,#1e1717,#141719)}
.mini-label{font-size:10.5px;color:var(--dim);letter-spacing:.22em}
.mini-name{font-size:19px;margin:7px 0 5px;letter-spacing:.06em}
.mini.good .mini-name{color:#8fc79b}
.mini.bad .mini-name{color:#d98b86}
.mini-tag{font-size:11px;color:#6d727c}

.card{background:linear-gradient(180deg,#1a1d23,#15181d);border:1px solid var(--line);
  border-radius:16px;padding:16px;margin-top:12px;animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.main{position:relative;overflow:hidden;border-color:#5a4a22;background:linear-gradient(180deg,#221d10,#171510)}
.main::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 88% -15%,rgba(208,169,74,.2),transparent 62%)}
.main-name{font-size:34px;letter-spacing:.16em;text-indent:.16em;margin:8px 0 6px;position:relative;z-index:1}
.main-name.good{color:#a9d8b2}
.main-name.bad{color:#e09792}
.main-sub{font-size:12.5px;color:#a99c78;letter-spacing:.14em;position:relative;z-index:1}
.badge{display:inline-block;font-size:11.5px;padding:2px 11px;border-radius:999px;letter-spacing:.16em;position:relative;z-index:1}
.badge.good{color:#8fc79b;border:1px solid #2e4a36;background:rgba(95,158,110,.1)}
.badge.bad{color:#d98b86;border:1px solid #4a2c2c;background:rgba(193,80,74,.1)}
.poem{border-left:2px solid var(--gold2);padding-left:12px;margin-top:14px;
  color:#c9c2b0;font-size:13.5px;line-height:2;letter-spacing:.02em}

.sec-label{font-size:11.5px;color:var(--gold);letter-spacing:.32em;margin-bottom:10px}
.txt{font-size:14.5px;line-height:1.95;color:var(--dimtxt);margin:0;letter-spacing:.02em}
.image-line{color:#a99c78;font-size:13.5px;line-height:1.85;padding-bottom:10px;border-bottom:1px dashed #262c34;margin-bottom:12px}
.advice-line{margin-top:12px;color:#9aa3ae;font-size:13.5px;line-height:1.9}

.flow-row{display:flex;align-items:center;gap:6px}
.flow-cell{flex:1;text-align:center;background:#14171c;border:1px solid var(--line);border-radius:12px;padding:10px 3px}
.flow-cell .k{display:block;font-size:10.5px;color:#6d727c;margin-bottom:4px}
.flow-cell b{display:block;font-size:16px;font-weight:400}
.flow-cell em{display:block;font-size:10.5px;color:#5d626c;font-style:normal;margin-top:3px}
.flow-cell.good b{color:#8fc79b}
.flow-cell.bad b{color:#d98b86}
.arrow{color:#3d434d;font-size:16px}

.findcard{border-color:#5a4a22;background:linear-gradient(180deg,#201b10,#161409)}
.find-badge{display:inline-block;font-size:11.5px;color:var(--gold);border:1px solid var(--gold2);
  background:rgba(208,169,74,.1);padding:2px 12px;border-radius:999px;margin-bottom:10px;letter-spacing:.14em}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:#171b21;border:1px solid #2f3540;color:#b9b2a1;font:inherit;
  font-size:13px;padding:9px 12px;border-radius:10px;letter-spacing:.02em}
.chips button:active{background:#20262e;color:var(--gold)}
.ask-row{display:flex;gap:8px;margin-top:12px}
.ask-row input{flex:1;min-width:0;background:#14171c;border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;color:var(--ink);font:inherit;font-size:14px;outline:none}
.ask-row input:focus{border-color:var(--gold2)}
.ask-row input::placeholder{color:#4a4f58}
.ask-row button{padding:0 20px;border-radius:12px;border:1px solid #6b5520;
  background:linear-gradient(180deg,#3a2f14,#241d0c);color:var(--gold);font:inherit;font-size:14px}
.ans{margin-top:16px;padding-top:14px;border-top:1px dashed #262c34;animation:fade .4s ease both}
.ans-q{font-size:13px;color:#8b8f99;margin-bottom:9px;line-height:1.7}
.ans-tag{display:inline-block;font-size:11px;color:var(--gold);border:1px solid #4a3d1c;
  padding:1px 8px;border-radius:999px;margin-right:7px}
.ans-topic{display:inline-block;font-size:10.5px;color:#7d8390;border:1px solid #2f3540;
  border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:middle}
.ans-a{font-size:14.5px;line-height:1.95;color:var(--dimtxt)}
.ans-flow{margin-top:9px;font-size:12.5px;color:#8a7a4e;line-height:1.8}
.ans-empty{color:#4a4f58;font-size:13px;padding-top:14px}

.res-meta{font-size:12px;color:#6d727c;letter-spacing:.06em;margin-top:18px;text-align:center}
.h-title{display:flex;justify-content:space-between;align-items:center;margin-top:26px;margin-bottom:6px}
.h-title span{font-size:11.5px;color:var(--gold);letter-spacing:.3em}
.h-title button{background:none;border:0;color:#5d626c;font:inherit;font-size:12px}
.h-list{background:#14171c;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.h-item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;
  border-bottom:1px solid #1e2229;font-size:13.5px;gap:10px}
.h-item:last-child{border-bottom:0}
.h-item:active{background:#191d23}
.h-main{display:flex;flex-direction:column;gap:5px;min-width:0}
.h-main .l{color:#ded6c2;letter-spacing:.06em}
.h-main .s{font-size:11.5px;color:#6d727c;letter-spacing:.05em}
.h-badge{display:inline-block;font-size:10.5px;color:var(--gold);border:1px solid #4a3d1c;
  border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:middle}
.h-item .r{color:#5d626c;font-size:11.5px;flex:0 0 auto}
.empty{padding:20px;text-align:center;color:#4a4f58;font-size:13px}

.quick{margin-top:12px}
.q-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.q-item{background:#14171c;border:1px solid var(--line);border-radius:12px;padding:11px 12px;
  display:flex;justify-content:space-between;align-items:center}
.q-item .n{font-size:15px;letter-spacing:.08em}
.q-item .t{font-size:11.5px;color:#6d727c}
.q-item.good .n{color:#8fc79b}
.q-item.bad .n{color:#d98b86}

footer{margin-top:26px;text-align:center;font-size:11px;color:#454a53;line-height:1.9;letter-spacing:.08em}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>小六<span class="dot">壬</span></h1>

    <button data-t="love">感情</button>

    <button data-t="wealth">财运</button>
    <button data-t="find">寻物</button>

    <button id="tabNum">报数起课</button>

      <div class="info-row"><span>公 历</span><b id="iSolar">—</b></div>

      <input id="n1" type="number" inputmode="numeric" placeholder="第一数" min="1" max="99">
      <input id="n2" type="number" inputmode="numeric" placeholder="第二数" min="1" max="99">
      <input id="n3" type="number" inputmode="numeric" placeholder="第三数" min="1" max="99">

    <div class="hint">心中默念所问之事，随意报三个数（1–99），或
      <button class="link" id="randBtn">随机取数</button>。</div>

  <button class="cast" id="castBtn">起 课</button>

  <div class="quick">
    <div class="h-title"><span>六 宫 速 查</span></div>

  <div class="h-title">
    <span>最 近 起 课</span>
    <button id="clearBtn">清空</button>
  </div>
  <div class="h-list" id="history"></div>

  <footer>
    民间传统术数，取象比类，仅供参考 · 请勿沉迷<br>
    单文件离线运行 · 数据仅存本机
  </footer>
</div>

function leapMonth(y){return lunarInfo[y-1900]&0xf}
function leapDays(y){return leapMonth(y)?((lunarInfo[y-1900]&0x10000)?30:29):0}
function monthDays(y,m){return (lunarInfo[y-1900]&(0x10000>>m))?30:29}
function lYearDays(y){
  let sum=348;
  for(let i=0x8000;i>0x8;i>>=1){ if(lunarInfo[y-1900]&i) sum++; }
  return sum+leapDays(y);
}
function solar2lunar(y,m,d){
  let offset=(Date.UTC(y,m-1,d)-Date.UTC(1900,0,31))/86400000;
  let i,temp=0,lunarYear=1900;
  for(i=1900;i<2101&&offset>0;i++){ temp=lYearDays(i); offset-=temp; }
  if(offset<0){ offset+=temp; i--; }
  lunarYear=i;
  const leap=leapMonth(lunarYear);
  let isLeap=false;
  for(i=1;i<13&&offset>0;i++){
    if(leap>0&&i===leap+1&&!isLeap){ --i; isLeap=true; temp=leapDays(lunarYear); }
    else{ temp=monthDays(lunarYear,i); }
    if(isLeap&&i===leap+1) isLeap=false;
    offset-=temp;
  }
  if(offset===0&&leap>0&&i===leap+1){
    if(isLeap){ isLeap=false; } else { isLeap=true; --i; }
  }
  if(offset<0){ offset+=temp; --i; }
  return {y:lunarYear,m:i,d:offset+1,isLeap};
}

/* ================= 工具 ================= */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const mod=(n,m)=>((n%m)+m)%m;
const esc=s=>String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;');

function lunarMonthName(m,isLeap){
  const n=['正','二','三','四','五','六','七','八','九','十','冬','腊'];
  return (isLeap?'闰':'')+n[m-1]+'月';
}
function lunarDayName(d){
  if(d===10) return '初十';
  if(d===20) return '二十';
  if(d===30) return '三十';
  const t=Math.floor(d/10), o=d%10;
  if(t===0) return '初'+CN_NUM[o-1];
  if(t===1) return '十'+CN_NUM[o-1];
  if(t===2) return '廿'+CN_NUM[o-1];
  return '三'+CN_NUM[o-1];
}
function ganzhiYear(y){
  const g='甲乙丙丁戊己庚辛壬癸', z='子丑寅卯辰巳午未申酉戌亥';
  return g[mod(y-4,10)]+z[mod(y-4,12)];
}

/* ================= 起课 ================= */
let mode='time', topic='general', cur=null;

function nowInfo(){
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth()+1, d=now.getDate(), h=now.getHours(), mi=now.getMinutes();
  let base=new Date(y,m-1,d), shifted=false;
  if(h>=23){ base=new Date(y,m-1,d+1); shifted=true; }
  const L=solar2lunar(base.getFullYear(),base.getMonth()+1,base.getDate());
  const hi=Math.floor(mod(h+1,24)/2);
  return {
    L, hi, shifted,
    dateStr:`${y}-${pad(m)}-${pad(d)} ${pad(h)}:${pad(mi)}`,
    lunarStr:`${ganzhiYear(L.y)}年 ${lunarMonthName(L.m,L.isLeap)}${lunarDayName(L.d)}`,
    hourStr:`${HOURS[hi]}时`
  };
}
function refreshTime(){
  const t=nowInfo();
  $('iSolar').textContent=t.dateStr;
  $('iLunar').textContent=t.lunarStr;
  $('iHour').textContent=t.hourStr+(t.shifted?'（晚子）':'');
}
function castByTime(){
  const t=nowInfo();
  const mi=mod(t.L.m-1,6);
  const di=mod(mi+t.L.d-1,6);
  const ti=mod(di+t.hi,6);
  return {mi,di,ti,meta:`${t.dateStr} · 农历${lunarMonthName(t.L.m,t.L.isLeap)}${lunarDayName(t.L.d)} ${t.hourStr} · 时辰起课`};
}
function castByNums(a,b,c){
  const i1=mod(a-1,6), i2=mod(i1+b-1,6), i3=mod(i2+c-1,6);
  return {mi:i1,di:i2,ti:i3,meta:`报数 ${a} · ${b} · ${c} · 报数起课`};
}

function renderResult(r){
  cur=r;
  topic=r.topic||topic;
  syncTopicUI();

  const m=PALACES[r.mi], d=PALACES[r.di], t=PALACES[r.ti];
  const total=sc(m)+sc(d)+sc(t);

  const headCard=`
  <div class="card main">
    <span class="badge ${t.luckType}">${t.luck} 课</span>
    <div class="main-name ${t.luckType}">${t.name}</div>
    <div class="main-sub">${t.god} · 五行属${t.wuxing} · 主数 ${t.nums}</div>
    <div class="poem">${t.poem}</div>
  </div>`;

  const flowCard=`
  <div class="card">
    <div class="sec-label">◆ 三 宫 走 势</div>
    <div class="flow-row">
      ${flowCell('起',m,'事之始')}<div class="arrow">›</div>
      ${flowCell('中',d,'事之过程')}<div class="arrow">›</div>
      ${flowCell('成',t,'事之结果')}
    </div>
    <p class="txt" style="margin-top:14px">${flowLine(m,d,t)}</p>
  </div>`;

  const findCard=`
  <div class="card findcard">
    <div class="sec-label">◆ 寻 物</div>
    <div class="find-badge">${t.find.level}</div>
    <p class="txt">${t.find.trend}</p>
    <p class="txt" style="margin-top:10px;color:#9aa3ae;font-size:13.5px;">方位：${t.find.where}</p>
  </div>`;

  const timeCard=`
  <div class="card">
    <div class="sec-label">◆ 应 期</div>
    <p class="txt">${t.time}</p>
  </div>`;

  const overCard=`
  <div class="card">
    <div class="sec-label">◆ 总 断</div>
    <p class="txt">${overallText(total)}</p>
    <p class="txt" style="margin-top:10px;color:#7b8089;font-size:13px;">
    月宫主事之始，日宫主事之中，时宫主事之成；上以时宫为主，三宫合参。</p>
  </div>`;

  const askCard=`
  <div class="card">
    <div class="sec-label">◆ 追 问 · ${TOPIC_META[topic].label}</div>
    <div class="chips" id="chips"></div>
    <div class="ask-row">
      <input id="askInput" placeholder="还想问什么，写在这里…">
      <button id="askBtn">问</button>
    </div>
    <div id="answers"></div>
  </div>`;

  const showFind=(topic==='general'||topic==='find');

  $('result').innerHTML=
    `<div class="res-meta">${r.meta}</div>`+
    `<div class="triple">${mini('月宫',m)}${mini('日宫',d)}${mini('时宫',t)}</div>`+
    headCard+
    `<div id="detailSlot"></div>`+
    flowCard+
    (showFind?findCard:'')+
    timeCard+overCard+askCard;

  renderDetail(t);
  bindAsk();
  renderAsks();
}

function renderDetail(t){
  const slot=$('detailSlot');
  if(!slot) return;
  let body='', tail='';
  if(topic==='general'){
    body=t.general;
    tail=`【宜】${t.advice}`;
  }else if(topic==='find'){
    body=t.find.where;
    tail=`【寻法】${t.find.who}`;
  }else{
    body=t[topic].read;
    tail=`【要点】${t[topic].cont||t[topic].get||''}`;
  }
  slot.innerHTML=`
  <div class="card">
    <div class="sec-label">◆ 详 解 · ${TOPIC_META[topic].label}</div>
    <p class="txt image-line">${t.image}</p>
    <p class="txt">${body}</p>
    <p class="txt advice-line">${tail}</p>
  </div>`;
}

/* ================= 追问引擎 ================= */
function detectIntent(q){
  const s=q;
  if(topic==='find'){
    if(/找回|找得回|还能找|能不能找/.test(s)) return 'found';
    if(/谁|帮忙|问谁/.test(s)) return 'who';
    if(/什么时候|何时|多久|几天/.test(s)) return 'when';
    if(/哪里|哪儿|什么地方|位置|在哪/.test(s)) return 'where';
    return 'trend';
  }
  if(topic==='wealth'){
    if(/破财|亏|损失|被骗/.test(s)) return 'loss';
    if(/方向|方位|哪里|哪个方向|怎么做|如何求/.test(s)) return 'way';
    if(/什么时候|何时|多久/.test(s)) return 'when';
    if(/能不能得|能否得|得不得|能不能赚|能不能/.test(s)) return 'get';
    return 'read';
  }
  if(topic==='love'){
    if(/主动|表白|开口|联系|约|追/.test(s)) return 'act';
    if(/对方|他|她|心里|想法|态度|心意|喜欢/.test(s)) return 'heart';
    if(/继续|发展|该不该|要不要|放弃|分手|复合|和好/.test(s)) return 'cont';
    if(/什么时候|何时|多久|转机/.test(s)) return 'when';
    return 'read';
  }
  if(topic==='career'){
    if(/贵人|帮忙|谁|人脉|同事|上司|领导/.test(s)) return 'people';
    if(/继续|坚持|跳槽|辞职|换工作|该不该|要不要/.test(s)) return 'cont';
    if(/什么时候|何时|多久|见分晓/.test(s)) return 'when';
    return 'read';
  }
  if(/什么时候|何时|多久|应期/.test(s)) return 'when';
  if(/注意|提防|小心|防|避|忌/.test(s)) return 'advice';
  if(/进还是退|进退|该不该|要不要|继续/.test(s)) return 'advice';
  return 'read';
}

function makeAnswer(intent){
  const p=PALACES[cur.ti];
  if(topic==='find'){
    return intent==='who'  ? p.find.who
         : intent==='when' ? p.find.when
         : intent==='where'? p.find.where
         : p.find.trend;
  }
  if(topic==='love'||topic==='career'||topic==='wealth'){
    const box=p[topic];
    return box[intent]||box.read||p.general;
  }
  return intent==='when' ? p.time : intent==='advice' ? p.advice : p.general;
}

function renderAsks(){
  const box=$('answers');
  if(!box) return;
  if(!cur||!cur.asks||!cur.asks.length){
    box.innerHTML='<div class="ans-empty">此卦暂无追问记录</div>';
    return;
  }
  const p=PALACES[cur.ti], m=PALACES[cur.mi], d=PALACES[cur.di];
  box.innerHTML=cur.asks.map(it=>{
    const tp=TOPIC_META[it.topic]?TOPIC_META[it.topic].label:'-';
    return `<div class="ans">
      <div class="ans-q">问：${esc(it.q)}<span class="ans-topic">${tp}</span></div>
      <div class="ans-a"><span class="ans-tag">${p.name}</span>${it.a}</div>
      <div class="ans-flow">走势：${flowLine(m,d,p)}</div>
    </div>`;
  }).join('');
}

function ask(text){
  if(!cur) return;
  const q=(text||'').trim();
  if(!q) return;
  const intent=detectIntent(q);
  const a=makeAnswer(intent);
  if(!Array.isArray(cur.asks)) cur.asks=[];
  cur.asks.push({q:q,a:a,intent:intent,topic:topic,t:Date.now()});
  saveHistory(cur);
  renderAsks();
  const box=$('answers');
  if(box.lastElementChild) box.lastElementChild.scrollIntoView({behavior:'smooth',block:'center'});
}

function bindAsk(){
  const chips=$('chips');
  chips.innerHTML=TOPIC_META[topic].chips
    .map(c=>`<button data-q="${c}">${c}</button>`).join('');
  chips.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>ask(b.dataset.q);
  });
  const inp=$('askInput'), btn=$('askBtn');
  btn.onclick=()=>{ ask(inp.value); inp.value=''; };
  inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); ask(inp.value); inp.value=''; } };
}

/* ================= 历史（一卦一档） ================= */
const KEY='xlr_history_v1';

function getHistory(){
  let list=[];
  try{ list=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ list=[]; }
  let changed=false;
  list=list.map((it,i)=>{
    if(!it.id){ it.id='g'+it.t+'_'+i; changed=true; }
    if(!it.topic){ it.topic='general'; changed=true; }
    if(!Array.isArray(it.asks)){ it.asks=[]; changed=true; }
    return it;
  });
  if(changed){ try{ localStorage.setItem(KEY,JSON.stringify(list)); }catch(e){} }
  return list;
}

function saveHistory(rec){
  const list=getHistory();
  const i=list.findIndex(x=>x.id===rec.id);
  if(i>=0) list[i]=rec; else list.unshift(rec);
  try{ localStorage.setItem(KEY,JSON.stringify(list.slice(0,30))); }catch(e){}
  renderHistory();
}

function renderHistory(){
  const list=getHistory();
  const el=$('history');
  if(!list.length){ el.innerHTML='<div class="empty">尚无记录</div>'; return; }
  el.innerHTML=list.map((it,i)=>{
    const m=PALACES[it.mi], d=PALACES[it.di], t=PALACES[it.ti];
    const date=new Date(it.t||Date.now());
    const ts=`${pad(date.getMonth()+1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
    const tp=TOPIC_META[it.topic]?TOPIC_META[it.topic].label:'综合';
    const n=it.asks?it.asks.length:0;
    return `<div class="h-item" data-i="${i}">
      <div class="h-main">
        <span class="l">${m.name} · ${d.name} · <b style="color:#d0a94a;font-weight:400">${t.name}</b></span>
        <span class="s">${tp}方向${n?`<span class="h-badge">追问 ${n}</span>`:''}</span>
      </div>
      <span class="r">${ts}</span>
    </div>`;
  }).join('');
  el.querySelectorAll('.h-item').forEach(node=>{
    node.onclick=()=>{
      const it=getHistory()[+node.dataset.i];
      if(!it) return;
      renderResult({
        id:it.id, mi:it.mi, di:it.di, ti:it.ti,
        meta:it.meta, topic:it.topic, asks:it.asks.slice(), t:it.t
      });
      window.scrollTo({top:0,behavior:'smooth'});
    };
  });
}

/* ================= 交互 ================= */
$('topics').querySelectorAll('button').forEach(b=>{
  b.onclick=()=>{
    topic=b.dataset.t;
    syncTopicUI();
    localStorage.setItem('xlr_topic',topic);
    if(cur){
      cur.topic=topic;
      saveHistory(cur);
      renderResult(cur);
    }
  };
});

$('tabTime').onclick=()=>{
  mode='time';
  $('tabTime').classList.add('on'); $('tabNum').classList.remove('on');
  $('panelTime').classList.add('on'); $('panelNum').classList.remove('on');
  refreshTime();
};
$('tabNum').onclick=()=>{
  mode='num';
  $('tabNum').classList.add('on'); $('tabTime').classList.remove('on');
  $('panelNum').classList.add('on'); $('panelTime').classList.remove('on');
};
$('randBtn').onclick=()=>{
  ['n1','n2','n3'].forEach(id=>{ $(id).value=1+Math.floor(Math.random()*99); });
};

function newId(){ return 'r'+Date.now()+Math.floor(Math.random()*900+100); }

$('castBtn').onclick=()=>{
  if(navigator.vibrate) navigator.vibrate(12);
  let base;
  if(mode==='time'){
    base=castByTime();
  }else{
    let a=parseInt($('n1').value,10), b=parseInt($('n2').value,10), c=parseInt($('n3').value,10);
    if(!a||!b||!c){
      ['n1','n2','n3'].forEach(id=>{ if(!$(id).value) $(id).value=1+Math.floor(Math.random()*99); });
      a=parseInt($('n1').value,10); b=parseInt($('n2').value,10); c=parseInt($('n3').value,10);
    }
    a=Math.min(99,Math.max(1,a)); b=Math.min(99,Math.max(1,b)); c=Math.min(99,Math.max(1,c));
    $('n1').value=a; $('n2').value=b; $('n3').value=c;
    base=castByNums(a,b,c);
  }
  const rec={
    id:newId(), mi:base.mi, di:base.di, ti:base.ti,
    meta:base.meta, topic:topic, asks:[], t:Date.now()
  };
  renderResult(rec);
  saveHistory(rec);
  setTimeout(()=>{ $('result').scrollIntoView({behavior:'smooth',block:'start'}); },60);
};

$('clearBtn').onclick=()=>{
  if(confirm('清空全部起课记录？')){
    localStorage.removeItem(KEY); renderHistory();
  }
};

$('quickGrid').innerHTML=PALACES.map(p=>
  `<div class="q-item ${p.luckType}">
     <span class="n">${p.name}</span>
     <span class="t">${p.luck} · ${p.short}</span>
   </div>`).join('');

/* 初始化 */
(function init(){
  const saved=localStorage.getItem('xlr_topic');
  if(saved&&TOPIC_META[saved]) topic=saved;
  syncTopicUI();
  refreshTime();
  renderHistory();
})();
setInterval(()=>{ if(mode==='time') refreshTime(); },30000);
</script>
